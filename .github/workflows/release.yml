name: Release

# Publishing a GitHub Release is what makes an update visible in HACS: it reads
# the release list to offer the update and renders the release body as the
# release notes shown in Home Assistant. A bare tag is not enough.
#
# Release flow:
#   1. bump "version" in custom_components/daze/manifest.json (and pyproject.toml)
#   2. commit, then `git tag -a v0.2.0` - the tag message, if any, becomes the
#      human-written intro above the generated changelog
#   3. `git push origin main --follow-tags`

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # git-cliff needs the full history to diff against the previous tag.
          fetch-depth: 0

      - name: Check manifest version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(python3 -c "import json; print(json.load(open('custom_components/daze/manifest.json'))['version'])")
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag is v$tag but manifest.json says $manifest - Home Assistant would report the wrong version"
            exit 1
          fi
          pyproject=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "$pyproject" ]; then
            echo "::warning::pyproject.toml version is $pyproject, not $tag"
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run python -m pytest tests/ -q

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: CHANGELOG_LATEST.md

      - name: Compose release notes
        run: |
          {
            # Annotated-tag message first, as a plain-language intro for users;
            # empty for a lightweight tag. `contents:subject`/`contents:body`
            # rather than `contents` so a signature is never included.
            git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$GITHUB_REF_NAME"
            cat CHANGELOG_LATEST.md
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          # HACS only offers pre-releases to users who enabled beta versions.
          prerelease: ${{ contains(github.ref_name, '-') }}
